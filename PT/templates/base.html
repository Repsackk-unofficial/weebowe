<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Pan Tadeusz</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #121212; color: #e0e0e0; }
        header { background: linear-gradient(90deg, #000000, #1c1c1c); border-bottom: 1px solid #333; }
        nav { height: 100vh; background-color: #1a1a1a; border-right: 1px solid #333; }
        nav h5 { color: #bbb; }
        .nav-link { color: #ccc; border-radius: 10px; margin-bottom: 6px; padding: 10px; transition: all 0.2s ease; }
        .nav-link:hover { background-color: #2a2a2a; color: #fff; transform: translateX(5px); }
        .nav-link.active { background: linear-gradient(90deg, #343a40, #495057); color: white; font-weight: bold; }
        main { background: #1e1e1e; border-radius: 20px; box-shadow: 0 0 25px rgba(0,0,0,0.6); min-height: 80vh; color: #ddd; }
        main h2 { color: #fff; margin-bottom: 15px; }
        .lead { color: #aaa; }
        footer { background: #000; border-top: 1px solid #333; }
    </style>
</head>
<body>

<header class="text-white text-center p-4">
    <h1>Pan Tadeusz</h1>
    <p>Adam Mickiewicz – epopeja narodowa</p>
</header>

<div class="container-fluid">
    <div class="row">
        <nav class="col-md-3 col-lg-2 p-3">
            <h5 class="mb-3">Spis treści</h5>
            <ul class="nav flex-column">
                <li><a class="nav-link" href="/">Strona główna</a></li>
                <li><a class="nav-link" href="/k1">Księga I</a></li>
                <li><a class="nav-link" href="/k2">Księga II</a></li>
                <li><a class="nav-link" href="/k3">Księga III</a></li>
                <li><a class="nav-link" href="/k4">Księga IV</a></li>
                <li><a class="nav-link" href="/k5">Księga V</a></li>
                <li><a class="nav-link" href="/k6">Księga VI</a></li>
                <li><a class="nav-link" href="/k7">Księga VII</a></li>
                <li><a class="nav-link" href="/k8">Księga VIII</a></li>
                <li><a class="nav-link" href="/k9">Księga IX</a></li>
                <li><a class="nav-link" href="/k10">Księga X</a></li>
                <li><a class="nav-link" href="/k11">Księga XI</a></li>
                <li><a class="nav-link" href="/k12">Księga XII</a></li>
            </ul>
        </nav>

        <!-- Tutaj wstrzykuje się treść konkretnej strony -->
        <main id="content" class="col-md-9 col-lg-10 p-4">
            {% block content %}{% endblock %}
        </main>
    </div>
</div>

<footer class="text-white text-center p-3 mt-4">
    <p>Kacper Jaróg</p>
</footer>

</body>
</html>
